name: "CI: Rust Windows unit"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
jobs:
  proof:
    name: Windows strict clippy and core units (isolated proof)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 06012f69f90216dc1b074bffd2c6e5e75e09dc66
          persist-credentials: false
      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '06012f69f90216dc1b074bffd2c6e5e75e09dc66') { throw 'Wrong source revision' }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          save-if: 'false'
      - name: Changed crate unit tests
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-driver-core -p cua-driver-testkit -p cursor-overlay --lib -- --test-threads=1
      - name: Strict Windows lint for the three changed crates
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver-core -p cua-driver-testkit -p cursor-overlay --all-targets -- -D warnings
