name: "CI: Rust Windows unit"
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CUA_TELEMETRY: "0"
  DO_NOT_TRACK: "1"
jobs:
  proof:
    name: Windows strict clippy and core units (isolated proof)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 8ead6a4b203b92ddbaaae74b46591e25e4eab67b
          persist-credentials: false
      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '8ead6a4b203b92ddbaaae74b46591e25e4eab67b') { throw 'Wrong source revision' }
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          components: clippy
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "libs/cua-driver/rust -> target"
          save-if: 'false'
      - name: Strict Windows lint (same command as failing proof)
        working-directory: libs/cua-driver/rust
        run: cargo clippy --locked -p cua-driver-core -p cua-driver -p cua-driver-e2e -p platform-macos --all-targets -- -D warnings
      - name: Core unit tests
        working-directory: libs/cua-driver/rust
        run: cargo test --locked -p cua-driver-core --lib -- --test-threads=1
